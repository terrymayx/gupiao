name: Build Stock Galaxy V6.1 EXE

on:
  push:
    branches:
      - build/stock-galaxy-v6.1-exe
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reassemble and decode project source
        shell: pwsh
        run: |
          $dir = 'build/stock-galaxy-v6.1-exe'
          $ordered = @(
            'source.part00.b64','source.part01.b64','source.part02.b64',
            'source.part03a.b64','source.part03b.b64','source.part03c.b64','source.part03d.b64',
            'source.part04.b64','source.part05.b64','source.part06.b64','source.part07.b64',
            'source.part08.b64','source.part09.b64'
          )

          $pieces = @()
          foreach ($name in $ordered) {
            $path = Join-Path $dir $name
            if (-not (Test-Path $path)) { throw "Missing source chunk: $name" }
            $text = Get-Content $path -Raw
            $text = [regex]::Replace($text, '[^A-Za-z0-9+/=]', '')
            if ($name -like 'source.part03?.b64') {
              if ($text.Length -ne 1750) { throw "$name length $($text.Length), expected 1750" }
            }
            $pieces += $text
          }

          $clean = $pieces -join ''
          Write-Host "Source pieces: $($ordered.Count), clean chars: $($clean.Length)"
          if ($clean.Length -ne 66400) { throw "Unexpected base64 length: $($clean.Length), expected 66400" }

          [IO.File]::WriteAllBytes('stock-galaxy-source.zip', [Convert]::FromBase64String($clean))
          $zipHash = (Get-FileHash 'stock-galaxy-source.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "ZIP bytes: $((Get-Item stock-galaxy-source.zip).Length), SHA256: $zipHash"
          if ($zipHash -ne '00e8d2175972e08288b28a2068fc388f218e026975f5aa9ff6b18de355a2a0d3') {
            throw "Decoded ZIP hash mismatch: $zipHash"
          }

          Expand-Archive -Path 'stock-galaxy-source.zip' -DestinationPath 'stock-galaxy-source' -Force
          if (-not (Test-Path 'stock-galaxy-source/StockGalaxyDesktop_v6_1_real_sector_flow/package.json')) {
            throw 'Decoded project package.json not found'
          }

      - name: Set portable EXE filename
        shell: pwsh
        working-directory: stock-galaxy-source/StockGalaxyDesktop_v6_1_real_sector_flow
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $pkg.build | Add-Member -NotePropertyName artifactName -NotePropertyValue 'StockGalaxy-V6.1-Portable.exe' -Force
          $pkg | ConvertTo-Json -Depth 30 | Set-Content package.json -Encoding utf8

      - name: Install dependencies
        working-directory: stock-galaxy-source/StockGalaxyDesktop_v6_1_real_sector_flow
        run: npm install --no-audit --no-fund

      - name: Run bridge tests
        working-directory: stock-galaxy-source/StockGalaxyDesktop_v6_1_real_sector_flow
        run: |
          npm run bridge:smoke
          npm run sector:test

      - name: Build Windows portable EXE
        working-directory: stock-galaxy-source/StockGalaxyDesktop_v6_1_real_sector_flow
        run: npm run pack:win -- --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: StockGalaxy-V6.1-Windows-EXE
          path: stock-galaxy-source/StockGalaxyDesktop_v6_1_real_sector_flow/dist/*.exe
          if-no-files-found: error
          retention-days: 7
