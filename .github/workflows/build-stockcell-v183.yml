name: Build StockCell V1.84 Windows EXE

on:
  push:
    branches:
      - build-stockcell-v183
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore build source
        shell: pwsh
        run: |
          $parts = Get-ChildItem "stockcell-build-v183/source.part*" | Sort-Object Name
          if ($parts.Count -ne 12) { throw "Expected 12 source parts, got $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes("stockcell-build-v183/source.tar.xz", [Convert]::FromBase64String($b64))
          New-Item -ItemType Directory -Force "stockcell-build-v183/app" | Out-Null
          tar -xJf "stockcell-build-v183/source.tar.xz" -C "stockcell-build-v183/app"
          if (!(Test-Path "stockcell-build-v183/app/package.json")) { throw "package.json missing" }

      - name: Patch V1.84 portable data mode
        shell: pwsh
        run: node stockcell-build-v183/patch-v184.js

      - name: Verify patched source
        shell: pwsh
        working-directory: stockcell-build-v183/app
        run: |
          node --check main.js
          node --check preload.js
          node --check edge_bridge_server.js
          node -e "const p=require('./package.json');if(p.version!=='1.84.0')throw new Error('wrong version');if(!p.build.artifactName.startsWith('StockCellDesktop_V1_84.'))throw new Error('wrong artifact');console.log('V1.84 source verification PASS')"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: stockcell-build-v183/app
        run: npm install --no-audit --no-fund

      - name: Build portable EXE
        working-directory: stockcell-build-v183/app
        run: npx electron-builder --win portable

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = "stockcell-build-v183/app/dist/StockCellDesktop_V1_84.exe"
          if (!(Test-Path $exe)) { throw "EXE not found: $exe" }
          $item = Get-Item $exe
          if ($item.Length -lt 10000000) { throw "EXE unexpectedly small: $($item.Length)" }
          $bytes = [IO.File]::ReadAllBytes($exe)
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "Not a Windows PE executable" }
          $item | Format-List Name,Length,LastWriteTime

      - name: Upload EXE only
        uses: actions/upload-artifact@v4
        with:
          name: StockCellDesktop_V1_84_EXE
          path: stockcell-build-v183/app/dist/StockCellDesktop_V1_84.exe
          if-no-files-found: error
          compression-level: 0
