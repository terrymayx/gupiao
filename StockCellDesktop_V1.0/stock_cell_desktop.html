<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A股资金细胞透明桌面版 V1.0</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#eaf6ff;font-family:"Microsoft YaHei",Arial,sans-serif}.app{height:100%;position:relative}.top{height:54px;display:flex;align-items:center;gap:12px;padding:8px 12px;background:rgba(4,18,25,.50);border-bottom:1px solid rgba(80,150,170,.25);backdrop-filter:blur(5px);-webkit-app-region:drag}.title{font-weight:900;font-size:18px}.sub{font-size:10px;color:#8cb6c6}.tabs{display:flex;gap:6px}.tabs button,.tools button,#settings button{border:1px solid #285c6c;background:rgba(8,34,44,.82);color:#c8e9f3;border-radius:8px;padding:6px 9px;cursor:pointer;-webkit-app-region:no-drag}.tabs .active{background:#08749a;color:white}.stats{margin-left:auto;font-size:11px;color:#9dcbd8}canvas{position:absolute;left:0;top:54px;width:100%;height:calc(100% - 54px)}#status{position:absolute;left:12px;top:64px;padding:5px 8px;border-radius:8px;background:rgba(4,18,25,.55);font-size:10px;color:#9dd4e2;pointer-events:none}.tools{position:absolute;right:10px;top:62px;display:flex;gap:6px}.legend{position:absolute;left:12px;bottom:12px;padding:8px 10px;background:rgba(4,18,25,.52);border:1px solid rgba(70,135,155,.25);border-radius:10px;font-size:10px;color:#9abecb}.tip{display:none;position:absolute;z-index:20;min-width:190px;background:rgba(4,16,23,.94);border:1px solid #286174;border-radius:10px;padding:9px;font-size:11px;pointer-events:none}.tip b{color:#fff}.up{color:#ff6672}.down{color:#4be293}#settings{display:none;position:absolute;right:12px;top:96px;z-index:30;width:260px;padding:12px;border-radius:12px;background:rgba(4,16,23,.95);border:1px solid #285d6d;-webkit-app-region:no-drag}#settings.show{display:block}#settings input{width:100%;background:#071a22;border:1px solid #285263;color:#fff;padding:5px;border-radius:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.row{margin:7px 0}body.chrome-hidden .top,body.chrome-hidden .legend,body.chrome-hidden .tools{opacity:0;pointer-events:none}body.chrome-hidden canvas{top:0;height:100%}
</style>
</head>
<body><div class="app">
<div class="top"><div><div class="title">A股资金细胞 · 透明桌面版</div><div class="sub">红色=净流入 · 绿色=净流出 · EdgeBridge 127.0.0.1:17890</div></div><div class="tabs"><button class="active" data-mode="industry">行业</button><button data-mode="concept">概念</button></div><div class="stats"><span id="net">净额 --</span> · <span id="clock">--:--:--</span></div></div>
<canvas id="c"></canvas><div id="status">数据源：连接中…</div><div class="tools"><button id="settingsBtn">⚙设置</button><button id="hideBtn">隐藏UI</button></div><div class="legend">细胞越大 = 资金规模越大 · 点击板块查看跌幅前十</div><div id="tip" class="tip"></div>
<div id="settings"><b>透明桌面设置</b><div class="grid row"><input id="x" placeholder="X"><input id="y" placeholder="Y"><input id="w" placeholder="宽"><input id="h" placeholder="高"></div><div class="row">透明度 <span id="opText">100%</span><input id="op" type="range" min="25" max="100" value="100"></div><div class="row"><label><input id="top" type="checkbox" checked style="width:auto"> 始终置顶</label></div><div class="grid"><button id="apply">应用</button><button id="reset">默认</button><button id="pass">鼠标穿透</button><button id="close">收起</button></div><div style="margin-top:8px;font-size:9px;color:#7195a2">Alt+S 设置 · Alt+G 穿透 · Alt+H 隐藏UI</div></div>
</div>
<script>
(()=>{
const api=window.stockCellDesktop,c=document.getElementById('c'),ctx=c.getContext('2d'),tip=document.getElementById('tip'),statusEl=document.getElementById('status');let W=0,H=0,dpr=1,mode='industry',nodes=[],hover=null,expanded=null,busy=false,last=0;
function resize(){dpr=Math.max(1,devicePixelRatio||1);const r=c.getBoundingClientRect();W=r.width;H=r.height;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);
function radius(v){return Math.max(18,Math.min(58,18+Math.sqrt(Math.abs(v))*4.1))}function color(v){if(v>0){const a=Math.min(1,.35+Math.abs(v)/90);return `rgba(255,55,70,${a})`}const a=Math.min(1,.35+Math.abs(v)/90);return `rgba(48,220,128,${a})`}
function applyRows(rows){const old=new Map(nodes.map(n=>[n.code,n]));nodes=rows.filter(x=>x&&x.code).sort((a,b)=>Math.abs(b.flow)-Math.abs(a.flow)).slice(0,24).map((r,i)=>{const o=old.get(r.code);return o?Object.assign(o,{name:r.name,flow:+r.flow||0,pct:+r.pct||0,targetR:radius(+r.flow||0)}):{id:r.code,code:r.code,name:r.name,flow:+r.flow||0,pct:+r.pct||0,r:radius(+r.flow||0),targetR:radius(+r.flow||0),x:W*.5+(Math.random()-.5)*W*.70,y:H*.5+(Math.random()-.5)*H*.72,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,stocks:[]}});last=Date.now();updateNet()}
function updateNet(){const n=nodes.reduce((s,x)=>s+x.flow,0),el=document.getElementById('net');el.textContent=`净额 ${n>=0?'+':''}${n.toFixed(1)}亿`;el.className=n>=0?'up':'down'}
async function poll(force=false){if(busy||!api?.fetchSectors)return;busy=true;try{const r=await api.fetchSectors({mode});if(r?.ok&&r.rows?.length){applyRows(r.rows);statusEl.textContent=`数据源：${r.source==='edge_browser_data'?'EdgeBridge':'东方财富'} · ${r.rows.length}板块 · ${new Date().toLocaleTimeString('zh-CN',{hour12:false})}`}else statusEl.textContent='数据源：等待真实数据'}catch(e){statusEl.textContent='数据源：连接失败'}finally{busy=false}}
async function loadStocks(n){if(!api?.fetchDecliners||!n?.code)return;try{const r=await api.fetchDecliners({symbol:n.code,limit:10});if(r?.ok)n.stocks=(r.rows||[]).slice(0,10)}catch{}}
function physics(){for(const n of nodes){n.r+=(n.targetR-n.r)*.08;if(n!==expanded){n.x+=n.vx;n.y+=n.vy;if(n.x<n.r||n.x>W-n.r)n.vx*=-1;if(n.y<n.r||n.y>H-n.r)n.vy*=-1}}for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const a=nodes[i],b=nodes[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,min=a.r+b.r+5;if(d<min){const p=(min-d)*.08,nx=dx/d,ny=dy/d;a.x-=nx*p;a.y-=ny*p;b.x+=nx*p;b.y+=ny*p}}if(expanded){expanded.x+=(W*.5-expanded.x)*.09;expanded.y+=(H*.5-expanded.y)*.09}}
function blob(n,alpha=1){ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=color(n.flow);ctx.strokeStyle=n.flow>=0?'#ff7882':'#6cf0aa';ctx.lineWidth=1.2;ctx.beginPath();const pts=18;for(let i=0;i<=pts;i++){const a=i/pts*Math.PI*2,rr=n.r*(1+.07*Math.sin(a*5+n.id.length));const x=n.x+Math.cos(a)*rr,y=n.y+Math.sin(a)*rr;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='800 11px Microsoft YaHei';ctx.fillText(n.name,n.x,n.y-3);ctx.font='10px Arial';ctx.fillText(`${n.flow>=0?'+':''}${n.flow.toFixed(1)}亿`,n.x,n.y+13);ctx.restore()}
function drawExpanded(n){const stocks=n.stocks||[],R=Math.min(145,Math.min(W,H)*.29);stocks.forEach((s,i)=>{const a=-Math.PI/2+i/Math.max(1,stocks.length)*Math.PI*2,x=n.x+Math.cos(a)*R,y=n.y+Math.sin(a)*R*.68,r=12;ctx.strokeStyle='rgba(150,210,225,.32)';ctx.beginPath();ctx.moveTo(n.x,n.y);ctx.lineTo(x,y);ctx.stroke();ctx.fillStyle=(+s.changePct||0)>=0?'#e85a60':'#58a968';ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='9px Microsoft YaHei';ctx.fillText(s.name,x,y+r+11);ctx.fillStyle=(+s.changePct||0)>=0?'#ff727d':'#56e99b';ctx.fillText(`${(+s.changePct||0).toFixed(2)}%`,x,y+r+22)})}
function frame(){ctx.clearRect(0,0,W,H);physics();for(const n of nodes)if(n!==expanded)blob(n,.95);if(expanded){blob(expanded,1);drawExpanded(expanded)}requestAnimationFrame(frame)}
function hit(x,y){return [...nodes].reverse().find(n=>Math.hypot(x-n.x,y-n.y)<=n.r+5)}
c.addEventListener('mousemove',e=>{const r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;hover=hit(x,y);if(!hover){tip.style.display='none';return}tip.innerHTML=`<b>${hover.name}</b><br>主力净额：<span class="${hover.flow>=0?'up':'down'}">${hover.flow>=0?'+':''}${hover.flow.toFixed(2)} 亿</span><br>涨跌幅：${hover.pct>=0?'+':''}${hover.pct.toFixed(2)}%`;tip.style.left=Math.min(W-210,x+15)+'px';tip.style.top=Math.min(H-90,y+65)+'px';tip.style.display='block'});c.addEventListener('mouseleave',()=>tip.style.display='none');c.addEventListener('click',async e=>{const r=c.getBoundingClientRect(),n=hit(e.clientX-r.left,e.clientY-r.top);if(!n){expanded=null;return}expanded=expanded===n?null:n;if(expanded)await loadStocks(n)});
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;expanded=null;poll(true)});
const panel=document.getElementById('settings'),x=document.getElementById('x'),y=document.getElementById('y'),w=document.getElementById('w'),h=document.getElementById('h'),op=document.getElementById('op'),opText=document.getElementById('opText'),top=document.getElementById('top');async function sync(){const s=await api?.getWindowState?.();if(!s)return;x.value=s.bounds.x;y.value=s.bounds.y;w.value=s.bounds.width;h.value=s.bounds.height;op.value=Math.round(s.opacity*100);opText.textContent=op.value+'%';top.checked=s.alwaysOnTop}async function open(){panel.classList.add('show');await sync()}document.getElementById('settingsBtn').onclick=()=>panel.classList.contains('show')?panel.classList.remove('show'):open();document.getElementById('close').onclick=()=>panel.classList.remove('show');document.getElementById('apply').onclick=async()=>{await api.setBounds({x:+x.value,y:+y.value,width:+w.value,height:+h.value});sync()};document.getElementById('reset').onclick=async()=>{await api.resetWindow();sync()};document.getElementById('pass').onclick=async()=>{const s=await api.getWindowState();await api.setPassThrough(!s.clickThrough)};op.oninput=()=>{opText.textContent=op.value+'%';api.setOpacity(+op.value/100)};top.onchange=()=>api.setAlwaysOnTop(top.checked);document.getElementById('hideBtn').onclick=()=>document.body.classList.toggle('chrome-hidden');api?.onToggleSettings?.(open);api?.onChromeVisible?.(v=>document.body.classList.toggle('chrome-hidden',!v));
setInterval(()=>{document.getElementById('clock').textContent=new Date().toLocaleTimeString('zh-CN',{hour12:false})},1000);setInterval(()=>poll(false),1000);setInterval(()=>{if(expanded)loadStocks(expanded)},5000);resize();poll(true);frame();
})();
</script></body></html>
